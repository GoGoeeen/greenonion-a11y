name: DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref vghixeurkagwfohkvhzf
          echo "y" | supabase db push

      - name: Set GITHUB_TOKEN as Supabase Secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT_FOR_SUPABASE }}
        run: |
          supabase secrets set GITHUB_TOKEN="$GH_PAT" --project-ref vghixeurkagwfohkvhzf
          echo "✅ GITHUB_TOKEN set as Supabase secret"
